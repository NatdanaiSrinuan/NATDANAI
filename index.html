<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - ณัฐดนัย สีนวน</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* ป้องกันไม่ให้มีแถบเลื่อนถ้าไม่จำเป็น */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- แก้ชื่อไฟล์ PDF ให้ตรงกับของคุณ และเพิ่ม #toolbar=0 ต่อท้าย -->
    <iframe src="Resume.pdf#toolbar=0&navpanes=0&scrollbar=0" 
            style="width: 100%; height: 100%; border: none;">
    </iframe>
</body>
</html>
